{% extends 'base.html' %}

{% block content %}
<!-- Hero Section -->
<section id="about" class="relative bg-white dark:bg-darkBg py-32 lg:py-40 transition-colors duration-500 overflow-hidden">
    <!-- Decorative background elements -->
    <div class="absolute inset-0 z-0 opacity-30 dark:opacity-20 pointer-events-none">
        <div class="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-primary/20 blur-3xl"></div>
        <div class="absolute top-48 -left-24 w-72 h-72 rounded-full bg-indigo-400/20 blur-3xl"></div>
    </div>

    <div class="relative z-10 max-w-7xl mx-auto px-6 lg:px-8 text-center" data-aos="fade-up">
        <span class="text-primary dark:text-indigo-400 font-semibold tracking-wider uppercase text-sm mb-4 block">Welcome to my portfolio</span>
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 text-zinc-900 dark:text-white">
            Hi, I'm <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-indigo-400">Meher Shaikh</span>
        </h1>
        <p class="text-2xl md:text-3xl font-bold text-primary dark:text-indigo-400 mb-6 h-10">
            <span id="typed-text"></span>
        </p>
        <p class="text-xl font-light mb-12 max-w-3xl mx-auto text-zinc-600 dark:text-mutedDark leading-relaxed" data-aos="fade-up" data-aos-delay="100">
            I craft polished, robust, and highly scalable backend applications and scalable software systems.
        </p>
        <div class="flex flex-col sm:flex-row justify-center items-center space-y-4 sm:space-y-0 sm:space-x-6" data-aos="fade-up" data-aos-delay="200">
            <a href="{% url 'projects' %}" class="w-full sm:w-auto bg-primary text-white font-medium px-8 py-4 rounded-lg shadow-lg shadow-primary/30 hover:bg-primaryHover hover:shadow-xl transition-all duration-300">
                View My Work
            </a>
            <a href="/static/resume.pdf" target="_blank" class="w-full sm:w-auto bg-white dark:bg-darkCard text-zinc-900 dark:text-white border border-zinc-200 dark:border-zinc-700 font-medium px-8 py-4 rounded-lg hover:bg-zinc-50 dark:hover:bg-zinc-800 transition-all duration-300 flex items-center justify-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>Download CV</span>
            </a>
        </div>
    </div>
</section>

<!-- Scripts for Page Functionality -->
<script src="https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js"></script>
<script>
    // Typed.js Initialization
    var typed = new Typed('#typed-text', {
        strings: ['Python Developer', 'Backend Develoer],
        typeSpeed: 50,
        backSpeed: 30,
        backDelay: 2000,
        loop: true,
        showCursor: true,
        cursorChar: '|'
    });
</script>
{% endblock %}
