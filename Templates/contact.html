{% extends 'base.html' %}

{% block content %}
<!-- Contact Section with Form -->
<section id="contact" class="py-32 bg-white dark:bg-darkBg transition-colors duration-500 border-t border-zinc-200 dark:border-zinc-800">
    <div class="max-w-5xl mx-auto px-6 lg:px-8">
        <div class="text-center mb-16" data-aos="fade-up">
            <h2 class="text-sm font-semibold text-primary dark:text-indigo-400 tracking-wider uppercase mb-3">Contact</h2>
            <h3 class="text-4xl font-bold text-zinc-900 dark:text-white">Get In Touch</h3>
            <p class="mt-4 text-zinc-600 dark:text-mutedDark max-w-2xl mx-auto">Have a project in mind or just want to say hi? Fill out the form below and I'll get back to you as soon as possible.</p>
        </div>

        <div class="bg-zinc-50 dark:bg-darkCard rounded-2xl p-8 md:p-12 shadow-sm border border-zinc-100 dark:border-zinc-800" data-aos="fade-up" data-aos-delay="100">
            <form action="{% url 'contact' %}" method="POST" class="space-y-6">
                {% csrf_token %}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-2">Your Name</label>
                        <input type="text" id="name" name="name" required class="w-full bg-white dark:bg-darkBg border border-zinc-300 dark:border-zinc-700 rounded-lg px-4 py-3 text-zinc-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-indigo-500 transition-colors" placeholder="E.g. John Doe">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-2">Your Email</label>
                        <input type="email" id="email" name="email" required class="w-full bg-white dark:bg-darkBg border border-zinc-300 dark:border-zinc-700 rounded-lg px-4 py-3 text-zinc-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-indigo-500 transition-colors" placeholder="E.g. john@example.com">
                    </div>
                </div>
                <div>
                    <label for="subject" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-2">Subject</label>
                    <input type="text" id="subject" name="subject" required class="w-full bg-white dark:bg-darkBg border border-zinc-300 dark:border-zinc-700 rounded-lg px-4 py-3 text-zinc-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-indigo-500 transition-colors" placeholder="Project Inquiry">
                </div>
                <div>
                    <label for="message" class="block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-2">Your Message</label>
                    <textarea id="message" name="message" rows="6" required class="w-full bg-white dark:bg-darkBg border border-zinc-300 dark:border-zinc-700 rounded-lg px-4 py-3 text-zinc-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary dark:focus:ring-indigo-500 transition-colors" placeholder="Hi Meher, I would like to discuss..."></textarea>
                </div>
                <div class="text-right">
                    <button type="submit" class="w-full sm:w-auto bg-primary text-white font-medium px-10 py-4 rounded-lg shadow-lg shadow-primary/30 hover:bg-primaryHover hover:shadow-xl hover:-translate-y-1 transition-all duration-300">
                        Send Message to Meher
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
